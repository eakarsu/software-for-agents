name: Grounded agent workflow

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: software_for_agents_workflow_test
          POSTGRES_PASSWORD: ci-${{ github.run_id }}-${{ github.run_attempt }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:ci-${{ github.run_id }}-${{ github.run_attempt }}@127.0.0.1:5432/software_for_agents_workflow_test
      WORKFLOW_TEST_DATABASE_URL: postgresql://postgres:ci-${{ github.run_id }}-${{ github.run_attempt }}@127.0.0.1:5432/software_for_agents_workflow_test
      JWT_SECRET: ci-jwt-${{ github.run_id }}-${{ github.run_attempt }}-with-more-than-32-characters
      CORS_ORIGINS: http://localhost:5173
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - run: npm ci
        working-directory: backend
      - run: npm ci
        working-directory: frontend
      - run: npm run migrate
        working-directory: backend
      - run: npm run migrate
        working-directory: backend
      - run: npm run test:ci
        working-directory: backend
      - run: npm run build
        working-directory: frontend
      - run: npm audit --omit=dev --audit-level=low
        working-directory: backend
      - run: npm audit --omit=dev --audit-level=low
        working-directory: frontend
      - run: for f in app.js server.js middleware/*.js routes/agent-workflow.js routes/non-app-boundary.js lib/*.js scripts/migrate.js workers/tool-executor.js; do node --check "$f"; done
        working-directory: backend
      - run: sh scripts/check-secrets.sh
      - uses: gitleaks/gitleaks-action@v2
